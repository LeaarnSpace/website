# Local services for development: `npm run db:up` (needs Docker Desktop running)
services:
  postgres:
    image: postgres:17-alpine
    container_name: learnspace-postgres
    environment:
      POSTGRES_USER: learnspace
      POSTGRES_PASSWORD: learnspace
      POSTGRES_DB: learnspace
    # 5433 so it doesn't clash with a Postgres already installed on the machine
    ports:
      - "5433:5432"
    volumes:
      - learnspace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnspace"]
      interval: 2s
      retries: 15

volumes:
  learnspace-postgres:
